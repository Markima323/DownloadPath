<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>下载路径助手</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="header"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v11m-4-4 4 4 4-4M5 15v5h14v-5" /></svg></span><div><h1>下载路径助手</h1><p>让每个下载，都有自己的位置。</p></div><span class="version">0.1.0</span></header>
    <main>
      <div class="status-card"><div><h2 id="status-title">正在连接…</h2><p id="status-description">正在读取本机配置</p></div><label class="switch" aria-label="启用自动下载分流"><input id="enabled" type="checkbox" role="switch" disabled /><span class="switch-track" aria-hidden="true"></span></label></div>
      <div id="error" class="error" role="alert" hidden></div>
      <div class="stats"><div><strong id="rule-count">—</strong><span>启用规则</span></div><span class="divider"></span><div><strong id="preset-count">—</strong><span>路径预设</span></div></div>
      <section class="recent-section" aria-labelledby="recent-title"><div class="section-heading"><h2 id="recent-title">最近分流</h2><span id="recent-time"></span></div><div id="recent" class="recent"><span class="empty">命中规则的下载会显示在这里。</span></div></section>
      <button id="open-settings" type="button" class="settings-button">管理规则与路径 <span aria-hidden="true">↗</span></button>
      <button id="retry" type="button" class="retry" hidden>重新连接</button>
    </main>
    <footer><span class="privacy-dot"></span>本机运行，无需账户</footer>
    <div id="status-message" class="sr-only" role="status" aria-live="polite"></div>
  </body>
</html>
